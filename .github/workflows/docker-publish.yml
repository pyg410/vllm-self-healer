name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: vllm-self-healer:test
          cache-from: type=gha,scope=watchdog
          cache-to: type=gha,scope=watchdog,mode=max

      - name: Run tests in the image
        run: |
          docker run --rm \
            --volume "$PWD/tests:/app/tests:ro" \
            vllm-self-healer:test python -m unittest discover -v

      - name: Verify default command, non-root startup, and shutdown
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f watchdog-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach --name watchdog-smoke \
            --env VLLM_MODEL=smoke-test \
            --env STARTUP_GRACE_PERIOD=300 \
            vllm-self-healer:test
          ready=false
          for attempt in {1..20}; do
            if docker exec watchdog-smoke python -c \
              'import json, os; assert os.getuid() == 10001; assert json.load(open("/data/watchdog_state.json"))["state"] == "recovering"'; then
              ready=true
              break
            fi
            sleep 1
          done
          docker logs watchdog-smoke
          test "$ready" = true
          docker stop --time 10 watchdog-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' watchdog-smoke)" = 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
        with:
          images: ghcr.io/pyg410/vllm-self-healer
          # Tag pushes must not implicitly publish latest.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
          labels: |
            org.opencontainers.image.source=https://github.com/pyg410/vllm-self-healer

      - name: Build and push multi-platform image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=watchdog
          cache-to: type=gha,scope=watchdog,mode=max

      - name: Verify registry pull and published runtime
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          repository="ghcr.io/pyg410/vllm-self-healer"
          index=$(docker buildx imagetools inspect --raw "$repository@$IMAGE_DIGEST")
          # Classic Docker image stores cannot retain two architectures under
          # the same index digest. Pull each platform's distinct manifest.
          for arch in amd64 arm64; do
            digest=$(jq -er --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' \
              <<< "$index")
            image="$repository@$digest"
            docker pull --platform "linux/$arch" "$image"
            docker run --rm --platform "linux/$arch" "$image" \
              python -c 'import os; import watchdog.main; assert os.getuid() == 10001'
          done
